name: Product API - CRUD CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    services:
      mongodb:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'quit(db.adminCommand({ ping: 1 }).ok === 1 ? 0 : 1)'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 20s

    env:
      NODE_ENV: test
      PORT: "3000"
      MONGO_URI: mongodb://127.0.0.1:27017/productdb_ci
      API_URL: http://127.0.0.1:3000

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run model tests
        run: npm test

      - name: Start Product API
        run: |
          node src/server.js > api.log 2>&1 &
          echo $! > api.pid

      - name: Wait for API healthcheck
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error \
              --max-time 3 "$API_URL/health"; then
              echo ""
              echo "API healthcheck passed"
              exit 0
            fi
            sleep 2
          done

          echo "API healthcheck failed"
          cat api.log
          exit 1

      - name: Run CRUD integration tests
        run: npm run test:integration

      - name: Show API logs on failure
        if: failure()
        run: cat api.log || true

      - name: Stop Product API
        if: always()
        run: |
          if [ -f api.pid ]; then
            kill "$(cat api.pid)" || true
          fi

  publish-image:
    name: Publish image to Docker Hub
    needs: integration-test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    env:
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/product-api

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t "$IMAGE_NAME:latest" \
            -t "$IMAGE_NAME:$GITHUB_SHA" \
            .

      - name: Push Docker image
        run: |
          docker push "$IMAGE_NAME:$GITHUB_SHA"
          docker push "$IMAGE_NAME:latest"

      - name: Logout from Docker Hub
        if: always()
        run: docker logout
